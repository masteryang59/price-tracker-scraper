[project]
name = "price-tracker-scraper"
version = "0.1.0"
description = "Playwright price tracker with user-agent rotation, SQLite history and price-drop alerts."
requires-python = ">=3.11"

[project.scripts]
pricetracker = "pricetracker.cli:app"

[tool.setuptools]
packages = ["pricetracker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[batch_insert]
enabled = true
[evict_stale]
enabled = true
[cleanup_resources]
enabled = true
[batch_insert]
enabled = true